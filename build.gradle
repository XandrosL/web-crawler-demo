plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3'
}

group = "web.crawler.demo"
version = "0.0.1"

sourceSets {
    main.java.srcDirs = ["src/main/java"]
    main.resources.srcDirs = ["src/main/resources"]
    test.java.srcDirs = ["src/test/java"]
    test.resources.srcDirs = ["src/test/resources"]
}

springBoot {
    mainClass = "web.crawler.demo.MainApplication"
}

repositories {
	mavenCentral()
}

dependencies {
	compileOnly("org.projectlombok:lombok:1.18.44")
	annotationProcessor("org.projectlombok:lombok:1.18.44")
	
	testCompileOnly("org.projectlombok:lombok:1.18.44")
	testAnnotationProcessor("org.projectlombok:lombok:1.18.44")

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'

    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'com.h2database:h2:2.4.240'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}



test {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))

    // Uncomment the following to run mutation tests automatically, such as in a CI/CD pipeline.
    // Gradle build takes quite longer with them on, so I'm running them on demand only.
    
    // finalizedBy(tasks.named('pitest'))
}

jacocoTestReport {
    dependsOn(tasks.named('test'))
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = ['web.crawler.demo.*']
    excludedClasses = ['web.crawler.demo.configuration.*']
    threads = 16
    outputFormats = ['HTML', 'XML']
}